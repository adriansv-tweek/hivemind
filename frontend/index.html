<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hivemind</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          Arial,
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 0;
        color: #e9e6f5;
        background:
          radial-gradient(900px 620px at 16% 10%, rgba(64, 52, 112, 0.34), transparent 72%),
          radial-gradient(1000px 700px at 86% 12%, rgba(44, 70, 120, 0.22), transparent 68%),
          linear-gradient(180deg, #13121d 0%, #0c0b14 100%);
      }

      .app-shell {
        width: min(1240px, 100% - 48px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 900px);
        justify-content: center;
        gap: 24px;
      }

      .app-shell.search-open {
        grid-template-columns: minmax(0, 900px);
        justify-content: center;
        gap: 24px;
      }

      .main-canvas {
        min-height: 0;
        padding: 36px 30px 22px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(18, 17, 30, 0.58);
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.02);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: 3.15rem;
        font-weight: 700;
        letter-spacing: 0.15px;
        color: #f0eefc;
      }

      .subtitle {
        margin: 12px 0 42px;
        text-align: center;
        color: #aeaac7;
        font-size: 1.08rem;
      }

      .canvas-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 14px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #dddaf1;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
      }

      .icon-btn svg {
        display: block;
      }

      .composer {
        position: relative;
        max-width: 820px;
        margin: 0 auto;
      }

      .note-textarea {
        width: 100%;
        min-height: 56px;
        max-height: 260px;
        resize: none;
        overflow-y: auto;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #ece9fb;
        padding: 14px 64px 14px 16px;
        font-size: 0.98rem;
        outline: none;
        line-height: 1.45;
      }

      .note-textarea::placeholder {
        color: #9f9ab8;
      }

      .note-textarea:focus,
      .search-input:focus {
        border-color: rgba(167, 145, 255, 0.75);
        box-shadow: 0 0 0 3px rgba(167, 145, 255, 0.2);
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.07);
        color: #ece9fb;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.96rem;
        font-weight: 530;
        cursor: pointer;
        transition: 0.18s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .inline-file-button {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border-radius: 12px;
        font-size: 1.3rem;
        line-height: 1;
        white-space: nowrap;
        padding: 0;
        z-index: 2;
      }

      .composer-actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        max-width: 820px;
        margin-left: auto;
        margin-right: auto;
      }

      .hidden-file-input {
        display: none;
      }

      .note {
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.11);
        background: transparent;
        box-shadow: none;
        padding: 14px 4px 16px;
        margin-top: 0;
      }

      .note p {
        margin: 0 0 8px;
        line-height: 1.45;
        color: #d8d5e9;
      }

      .note strong {
        color: #f3f0ff;
      }

      .note details {
        margin-top: 8px;
      }

      .note details > summary {
        cursor: pointer;
        color: #cac6e1;
        user-select: none;
      }

      .note details[open] > summary {
        margin-bottom: 10px;
      }

      .tags {
        color: #9aa9ff !important;
        font-size: 0.88rem;
      }

      .status,
      .upload-status {
        margin-top: 14px;
        min-height: 20px;
        font-size: 0.92rem;
        color: #a9a4c2;
        max-width: 820px;
        margin-left: auto;
        margin-right: auto;
      }

      .upload-progress {
        display: none;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        color: #a9a4c2;
        font-size: 0.9rem;
        max-width: 820px;
        margin-left: auto;
        margin-right: auto;
      }

      .upload-progress.visible {
        display: inline-flex;
      }

      .spinner-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(166, 146, 255, 0.36);
        border-top-color: rgba(166, 146, 255, 0.95);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .status.error,
      .upload-status.error {
        color: #ff8ea0;
      }

      .notes-meta {
        margin: 16px 0 8px;
        color: #a9a4c2;
      }

      .note-date {
        color: #9b96b3;
        font-size: 0.84rem;
      }

      .delete-note-btn {
        margin-top: 8px;
        padding: 7px 11px;
        font-size: 0.86rem;
      }

      .search-sidebar {
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
        padding: 18px;
        margin-top: 18px;
        max-width: 880px;
        margin-left: auto;
        margin-right: auto;
      }

      .search-sidebar-title {
        margin: 0 0 14px;
        font-size: 1.02rem;
        font-weight: 600;
        color: #d7d3ed;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .search-input {
        width: 100%;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #ece9fb;
        padding: 12px 16px;
        margin-bottom: 14px;
        outline: none;
      }

      .search-input::placeholder {
        color: #9f9ab8;
      }

      .search-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .search-panel-hidden {
        display: none;
      }

      @media (max-width: 1080px) {
        body {
          align-items: flex-start;
          padding: 18px 0;
        }

        .app-shell {
          grid-template-columns: 1fr;
          width: min(980px, 100% - 36px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <main class="main-canvas">
        <h1>Hivemind</h1>
        <p class="subtitle">Capture ideas quickly and find them later.</p>

        <div class="canvas-actions">
          <button
            id="toggleSearchBtn"
            class="icon-btn"
            type="button"
            aria-label="Open search"
            aria-expanded="false"
            title="Search"
          ></button>
        </div>

        <section>
          <div class="composer">
            <textarea
              id="noteInput"
              class="note-textarea"
              placeholder="Paste text or ideas here..."
            ></textarea>
            <button id="pickFileBtn" class="inline-file-button" type="button" aria-label="Add file" title="Add file">+</button>
          </div>

          <div class="composer-actions">
            <button id="uploadFileBtn" type="button">Save attached file</button>
          </div>

          <p id="uploadStatus" class="upload-status"></p>
          <div id="uploadProgress" class="upload-progress">
            <span class="spinner-dot" aria-hidden="true"></span>
            <span id="uploadProgressText">Processing file...</span>
          </div>

          <input id="fileInput" class="hidden-file-input" type="file" accept=".pdf,image/*" />
        </section>

        <p id="statusText" class="status"></p>
        <section id="searchPanel" class="search-sidebar search-panel-hidden">
          <h2 class="search-sidebar-title">Find in Hivemind</h2>
          <input id="searchInput" class="search-input" type="text" placeholder="Search..." />
          <div class="search-actions">
            <button id="loadRecentBtn">Load recent notes</button>
          </div>

          <p id="notesMeta" class="notes-meta"></p>
          <section id="notesList"></section>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
